grain, very hard and wear resistant. Burns on dull blades and blotches badly with stain. Birdseye and curly figure available. The standard cutting board and workbench wood.",u:"Cutting boards, workbench tops, butcher block, flooring, painted or clear cabinets."},{n:"Soft maple",j:950,t:["paint","food","budget"],d:"Silver or red maple. Looks like hard maple but cheaper, softer, and easier on tools. Often has gray mineral streaks. Paints very well.",u:"Painted furniture, drawer parts, cabinet doors, budget cutting boards."},{n:"White oak",j:1360,t:["outdoor","insect","figured","hard"],d:"Closed pores (tyloses) make it water tight, which is why barrels and boats use it. Rot resistant, so it's the best domestic choice for outdoor furniture. Quartersawn shows dramatic ray fleck. Tannins react with steel: use stainless or coated fasteners or you'll get black stains. Heavy and hard on edges.",u:"Outdoor furniture, Mission and Craftsman style, flooring, doors, boats."},{n:"Red oak",j:1290,t:["budget","hard"],d:"Open pores you can blow air through, so it wicks water: not for outdoors or cutting boards. Cheap, strong, stains evenly, and everywhere. Pinkish cast compared to white oak.",u:"Indoor furniture, cabinets, trim, stair parts."},{n:"Ash",j:1320,t:["budget","figured","hard"],d:"Grain like oak but lighter and more uniform. Strong, shock resistant, and one of the best woods for steam bending. Emerald ash borer has made it cheap and plentiful. Not for outdoors.",u:"Chairs, tool handles, bats, tables, bent parts."},{n:"Hickory",j:1820,t:["hard","figured"],d:"Hardest common domestic hardwood. Dramatic contrast between pale sapwood and brown heartwood. Tough on blades, prone to tearout, and stubborn to glue and finish. Great smoking wood too.",u:"Tool handles, rustic cabinets and flooring, anything that takes abuse."},{n:"Poplar",j:540,t:["paint","budget"],d:"Cheap, soft, easy to work. Green and purple streaks that turn brown. Fuzzy under stain and doesn't stain well, but it's the best paint-grade hardwood there is.",u:"Painted furniture, face frames, drawer sides, secondary parts, shop jigs."},{n:"Pine (white / southern yellow)",j:420,t:["paint","budget"],d:"Cheap and soft; dents with a fingernail. Knots and pitch bleed through paint unless sealed with shellac-based primer first. Southern yellow pine is much harder and stringier than white pine. Blotches with stain (use a conditioner).",u:"Shop furniture, farmhouse pieces, framing, trim. Pressure treated only for outdoors."},{n:"Douglas fir",j:660,t:["budget"],d:"Straight, tight grain, strong for its weight, splinters easily. Vertical grain (rift) fir is stable and handsome. Dents but rarely warps once dry.",u:"Workbench tops, doors, beams, shop projects."},{n:"Western red cedar",j:350,t:["outdoor","insect","paint"],d:"Very light and soft, naturally rot and insect resistant, aromatic. Too soft for table tops. Takes paint and stain well; corrodes plain steel fasteners.",u:"Fences, planters, decks, pergolas, siding, outdoor benches."},{n:"Aromatic (Eastern red) cedar",j:900,t:["insect","figured"],d:"Purple-red heartwood with cream sapwood and lots of knots. The smell repels moths. Harder than western cedar but brittle.",u:"Closet liners, blanket chests, drawer bottoms, birdhouses."},{n:"Cypress",j:510,t:["outdoor","insect","paint"],d:"The Southern outdoor wood. Natural oil (cypressene) resists rot and bugs; old-growth is far more resistant than new-growth. Light, straight grained, easy to work, paints well.",u:"Porch swings, siding, outdoor furniture, planters, boat trim."},{n:"Black locust",j:1700,t:["outdoor","insect","hard"],d:"Domestic answer to ipe. Extremely rot resistant, hard, and heavy. Yellow-green that ages to brown. Tough to find at yards but common from sawyers.",u:"Fence posts, decks, outdoor furniture, mallet heads."},{n:"Mahogany / Sapele",j:1200,t:["outdoor","figured"],d:"Classic red-brown, stable, works easily, finishes to a glow. Sapele shows ribbon stripe when quartersawn but tears out on the router. Both handle weather well with finish.",u:"Entry doors, boats, fine furniture, guitar necks, outdoor trim."},{n:"Teak",j:1070,t:["outdoor","insect","hard"],d:"Oily, silica loaded, and nearly indestructible outdoors, which is why it's on every boat. Dulls edges fast; wipe joints with acetone before gluing. Very expensive.",u:"Outdoor furniture, boat decks, shower benches."},{n:"Ipe",j:3680,t:["outdoor","insect","hard"],d:"Dense enough to sink in water and rated for decades outdoors untreated. Brutal on tools, must be predrilled, and the dust is an irritant. Oily, so glue is unreliable.",u:"Decking, outdoor steps, benches. Fasteners only, not glue."},{n:"Purpleheart",j:2520,t:["figured","hard","food"],d:"Genuinely purple after cutting, darkens toward brown in sunlight. Very hard, dulls tools, can gum up on the saw. Popular as an accent stripe.",u:"Accent strips in cutting boards and boxes, inlay, turnings."},{n:"Padauk",j:1970,t:["figured","hard","food"],d:"Bright orange-red that fades to reddish brown. The dust stains everything (and everyone) orange and is a respiratory irritant, so mask up and clean the shop after. Works easily for its hardness.",u:"Accent strips, boxes, turnings, small decorative parts."}],Fm=[{n:"Baltic birch",d:"Void-free with many thin plies, so the edge looks good and screws bite well. Sold in 5\xD75 sheets and metric thicknesses (12 mm, 18 mm), not true 1/2 or 3/4. Face veneer is thin. The best all-round shop and cabinet plywood.",u:"Drawer boxes, jigs, shop cabinets, exposed-edge furniture."},{n:"Hardwood veneer plywood (cabinet grade)",d:"Oak, maple, birch, or walnut face over a softwood or MDF core. 3/4 is really 23/32. Veneer is paper thin, so sand lightly (don't go past 180) and never with 80 grit. Check both faces and the edges for voids before buying.",u:"Cabinet carcasses, built-ins, bookcases, panels."},{n:"MDF",d:"Dead flat, no grain, machines and paints beautifully. Heavy, swells and crumbles if it gets wet, and screws into the edge will split it (predrill and use coarse threads). The dust is fine and nasty: wear a respirator.",u:"Painted doors and panels, router templates, jigs, speaker boxes."},{n:"Sanded pine / BC plywood",d:"Cheap construction plywood with one decent face. Voids inside, so edges are ugly. Fine for paint after filling.",u:"Shop furniture, shelving, painted utility projects."},{n:"CDX / sheathing",d:"Rough on both faces, meant to be covered. Exterior glue but not exterior rated on its own.",u:"Subfloors, roof and wall sheathing, temporary jigs. Not furniture."},{n:"Melamine / particleboard",d:"Cheap, flat, pre-finished white or colored surface. Chips badly on the cut (score the line first or use an 80T blade). Weak edges and no water tolerance.",u:"Garage cabinets, closet systems, shop storage."},{n:"Marine plywood",d:"Waterproof glue and void-free plies, usually okoume or meranti. Still needs a finish; it isn't rot proof, just glue proof.",u:"Boats, dock boxes, anything that stays wet."},{n:"MDO (medium density overlay)",d:"Exterior plywood with a resin-paper face that takes paint like glass and handles weather. What sign shops use.",u:"Outdoor signs, painted exterior panels, concrete forms."},{n:"Pressure treated plywood",d:"Chemically treated for ground contact and weather. Wet and heavy when new; let it dry before painting. Use hot-dipped galvanized or stainless fasteners.",u:"Sheds, outdoor structures, trailer decks."}],Tm=[{h:"Pocket hole screw length (Kreg jig)",b:['1/2" stock: 1" screw','3/4" stock: 1 1/4" screw','1" stock: 1 1/2" screw','1 1/8" stock: 1 1/2" screw','1 1/4" stock: 2" screw','1 1/2" stock: 2 1/2" screw',"Coarse thread for softwood, plywood, and MDF. Fine thread for hardwood.","Set both the jig and the drill bit collar to the stock thickness. Use the thinner piece's size when joining two different thicknesses."]},{h:"Nominal vs. actual thickness",b:['Rough 4/4 surfaces to about 13/16". 5/4 to about 1 1/16". 6/4 to 1 5/16". 8/4 to 1 3/4".',"Yards charge by the nominal quarter size even if the board is surfaced thinner.","2\xD74 is 1 1/2 \xD7 3 1/2. 1\xD76 is 3/4 \xD7 5 1/2. 3/4 plywood is 23/32.","Board feet = length \xD7 width \xD7 thickness (all inches) \xF7 144."]},{h:"Wood movement",b:['Wood moves across the grain, almost none along it. A 12" wide flatsawn board can change 1/8" or more between summer and winter.',"Interior furniture wants 6 to 9 percent moisture. Let new lumber sit in the shop a week or two before milling.","Attach wide tops with slotted holes, figure-8s, or buttons. Never glue a cross-grain joint wider than a few inches.","Quartersawn moves about half as much as flatsawn and stays flatter."]},{h:"Glue",b:["Titebond I is interior. II is water resistant. III is waterproof, has the longest open time, and is food safe when cured.","Clamp 30 to 60 minutes, then leave the joint alone for 24 hours.","Long-grain joints are stronger than the wood. End-grain glue is nearly worthless; use a joint or fastener.","Wipe oily woods (teak, ipe, rosewood) with acetone right before gluing.","Wipe squeeze-out with a damp rag or scrape it when rubbery; dried glue blocks stain."]},{h:"Cutting boards",b:["Closed-grain hardwoods only: hard maple, walnut, cherry, beech. Skip oak (porous), softwoods, and any exotic with toxic dust.","Edge grain is simpler and stays flatter. End grain is kinder to knives but needs the extra glue-up and a flattening pass.",'For end grain, rip strips 1 1/4 to 1 1/2" wide, glue, crosscut, flip, and glue again.',"Finish with food-grade mineral oil, then a beeswax and oil paste. Never vegetable or olive oil (goes rancid).","Put rubber feet on it so it dries evenly and doesn't cup."]},{h:"Sanding and finishing",b:["Progression: 80 to flatten, 120, 180, 220. Skipping more than one grit leaves scratches.","Stop at 180 before stain; going finer closes the pores and lightens the color.","Raise the grain with a damp rag before any water-based finish, let dry, sand lightly, then finish.","Shellac (dewaxed) seals anything and blocks pine pitch and knots; poly goes over it.","Wipe-on poly is the easiest durable finish. Oil and wax is the easiest to repair.","Oil-soaked rags can self-ignite. Lay them flat outside to dry or put them in water."]},{h:"Screws, blades, tools",b:["Always predrill hardwood. Pilot hole equals the screw's core (shank) diameter. #8 handles most furniture.","Table saw: 24T rip, 40T combination for general use, 80T for plywood and crosscuts. Full kerf is 1/8, thin kerf about 3/32 (match the app setting).","Planer: 1/32 to 1/16 per pass on hardwood. Lift the tail of the board on entry and exit to reduce snipe, or run a sacrificial board behind it.","Riving knife on, push sticks out, never freehand a cut. Respirator for MDF and exotics; walnut and cedar dust are sensitizers."]}];function Dm(){let[e,t]=(0,q.useState)("woods"),[a,o]=(0,q.useState)(""),[r,l]=(0,q.useState)(""),u=Pm.filter(s=>(!a||s.t.includes(a))&&(!r||s.n.toLowerCase().includes(r.toLowerCase())));return(0,n.jsxs)("div",{className:"space-y-4",children:[(0,n.jsx)("div",{className:"flex gap-1 rounded-xl bg-stone-200 p-1",children:[["woods","Woods"],["sheets","Sheet goods"],["knows","Must-knows"]].map(([s,d])=>(0,n.jsx)("button",{onClick:()=>t(s),className:`flex-1 rounded-lg py-2 text-sm font-medium ${e===s?"bg-white shadow-sm":"text-stone-600"}`,children:d},s))}),e==="woods"&&(0,n.jsxs)(n.Fragment,{children:[(0,n.jsx)("input",{className:U,value:r,onChange:s=>l(s.target.value),placeholder:"Search a species"}),(0,n.jsxs)("div",{className:"flex flex-wrap gap-1",children:[(0,n.jsx)("button",{onClick:()=>o(""),className:`rounded-full px-3 py-1 text-sm ${a?"bg-white text-stone-700 border border-stone-300":"bg-amber-700 text-white"}`,children:"all"}),Object.entries(Nf).map(([s,d])=>(0,n.jsx)("button",{onClick:()=>o(a===s?"":s),className:`rounded-full px-3 py-1 text-sm ${a===s?"bg-amber-700 text-white":"border border-stone-300 bg-white text-stone-700"}`,
