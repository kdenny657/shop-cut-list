<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shop">
<meta name="theme-color" content="#b45309">
<title>Shop stock &amp; cut list</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23b45309'/%3E%3Crect x='20' y='35' width='60' height='30' fill='%23fef3c7'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23b45309'/%3E%3Crect x='20' y='35' width='60' height='30' fill='%23fef3c7'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#f5f5f4;margin:0;-webkit-text-size-adjust:100%}input,select,textarea{font-size:16px}</style>
<style>
#shopgate{position:fixed;inset:0;z-index:9999;background:#f5f5f4;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#shopgate .sg-card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:28px 24px;max-width:360px;width:100%;text-align:center}
#shopgate .sg-title{font-size:20px;font-weight:600;color:#1c1917}
#shopgate .sg-sub{margin-top:8px;font-size:14px;color:#57534e;line-height:1.4}
#shopsignin{margin-top:20px;width:100%;border:0;border-radius:10px;background:#b45309;color:#fff;font-size:16px;font-weight:600;padding:12px 16px;cursor:pointer}
#shopsignin:disabled{opacity:.6}
#shoploading{margin-top:20px;font-size:14px;color:#78716c}
#shoperr{margin-top:12px;font-size:13px;color:#b91c1c;word-break:break-word}
#shopbar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#292524;color:#e7e5e4;font:13px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#shopwho{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#shopstat{margin-left:auto;color:#a8a29e;white-space:nowrap}
#shopsignout{background:none;border:1px solid #57534e;color:#e7e5e4;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
#shopbanner{position:fixed;left:12px;right:12px;bottom:12px;z-index:9998;background:#b45309;color:#fff;border-radius:10px;padding:10px 14px;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;gap:10px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#shopbanner[hidden]{display:none}
#shoprefresh{margin-left:auto;background:#fff;color:#b45309;border:0;border-radius:6px;padding:5px 10px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div id="shopgate"><div class="sg-card"><div class="sg-title">Shop stock &amp; cut list</div><div class="sg-sub">Sign in to keep your stock and cut lists in sync across your phone, tablet, and computer.</div><button id="shopsignin" hidden>Continue with Google</button><div id="shoploading">Loading&hellip;</div><div id="shoperr"></div></div></div>
<div id="shopbar" hidden><span id="shopwho"></span><span id="shopstat"></span><button id="shopsignout">Sign out</button></div>
<div id="shopbanner" hidden><span>Updated on another device.</span><button id="shoprefresh">Refresh</button></div>
<script>
(function(){
  var P="shop:";
  function hook(){ if(window.__shopOnWrite){ try{ window.__shopOnWrite(); }catch(e){} } }
  window.__shopStorage={
    get:function(k){ var v=localStorage.getItem(P+k); if(v===null) return Promise.reject(new Error("not found")); return Promise.resolve({key:k,value:v,shared:false}); },
    set:function(k,v){ localStorage.setItem(P+k,v); hook(); return Promise.resolve({key:k,value:v,shared:false}); },
    "delete":function(k){ localStorage.removeItem(P+k); hook(); return Promise.resolve({key:k,deleted:true,shared:false}); },
    list:function(){ return Promise.resolve({keys:Object.keys(localStorage).filter(function(k){return k.indexOf(P)===0;}).map(function(k){return k.slice(P.length);}),shared:false}); }
  };
})();
</script>

'll get black stains. Heavy and hard on edges.",u:"Outdoor furniture, Mission and Craftsman style, flooring, doors, boats."},{n:"Red oak",j:1290,t:["budget","hard"],d:"Open pores you can blow air through, so it wicks water: not for outdoors or cutting boards. Cheap, strong, stains evenly, and everywhere. Pinkish cast compared to white oak.",u:"Indoor furniture, cabinets, trim, stair parts."},{n:"Ash",j:1320,t:["budget","figured","hard"],d:"Grain like oak but lighter and more uniform. Strong, shock resistant, and one of the best woods for steam bending. Emerald ash borer has made it cheap and plentiful. Not for outdoors.",u:"Chairs, tool handles, bats, tables, bent parts."},{n:"Hickory",j:1820,t:["hard","figured"],d:"Hardest common domestic hardwood. Dramatic contrast between pale sapwood and brown heartwood. Tough on blades, prone to tearout, and stubborn to glue and finish. Great smoking wood too.",u:"Tool handles, rustic cabinets and flooring, anything that takes abuse."},{n:"Poplar",j:540,t:["paint","budget"],d:"Cheap, soft, easy to work. Green and purple streaks that turn brown. Fuzzy under stain and doesn't stain well, but it's the best paint-grade hardwood there is.",u:"Painted furniture, face frames, drawer sides, secondary parts, shop jigs."},{n:"Pine (white / southern yellow)",j:420,t:["paint","budget"],d:"Cheap and soft; dents with a fingernail. Knots and pitch bleed through paint unless sealed with shellac-based primer first. Southern yellow pine is much harder and stringier than white pine. Blotches with stain (use a conditioner).",u:"Shop furniture, farmhouse pieces, framing, trim. Pressure treated only for outdoors."},{n:"Douglas fir",j:660,t:["budget"],d:"Straight, tight grain, strong for its weight, splinters easily. Vertical grain (rift) fir is stable and handsome. Dents but rarely warps once dry.",u:"Workbench tops, doors, beams, shop projects."},{n:"Western red cedar",j:350,t:["outdoor","insect","paint"],d:"Very light and soft, naturally rot and insect resistant, aromatic. Too soft for table tops. Takes paint and stain well; corrodes plain steel fasteners.",u:"Fences, planters, decks, pergolas, siding, outdoor benches."},{n:"Aromatic (Eastern red) cedar",j:900,t:["insect","figured"],d:"Purple-red heartwood with cream sapwood and lots of knots. The smell repels moths. Harder than western cedar but brittle.",u:"Closet liners, blanket chests, drawer bottoms, birdhouses."},{n:"Cypress",j:510,t:["outdoor","insect","paint"],d:"The Southern outdoor wood. Natural oil (cypressene) resists rot and bugs; old-growth is far more resistant than new-growth. Light, straight grained, easy to work, paints well.",u:"Porch swings, siding, outdoor furniture, planters, boat trim."},{n:"Black locust",j:1700,t:["outdoor","insect","hard"],d:"Domestic answer to ipe. Extremely rot resistant, hard, and heavy. Yellow-green that ages to brown. Tough to find at yards but common from sawyers.",u:"Fence posts, decks, outdoor furniture, mallet heads."},{n:"Mahogany / Sapele",j:1200,t:["outdoor","figured"],d:"Classic red-brown, stable, works easily, finishes to a glow. Sapele shows ribbon stripe when quartersawn but tears out on the router. Both handle weather well with finish.",u:"Entry doors, boats, fine furniture, guitar necks, outdoor trim."},{n:"Teak",j:1070,t:["outdoor","insect","hard"],d:"Oily, silica loaded, and nearly indestructible outdoors, which is why it's on every boat. Dulls edges fast; wipe joints with acetone before gluing. Very expensive.",u:"Outdoor furniture, boat decks, shower benches."},{n:"Ipe",j:3680,t:["outdoor","insect","hard"],d:"Dense enough to sink in water and rated for decades outdoors untreated. Brutal on tools, must be predrilled, and the dust is an irritant. Oily, so glue is unreliable.",u:"Decking, outdoor steps, benches. Fasteners only, not glue."},{n:"Purpleheart",j:2520,t:["figured","hard","food"],d:"Genuinely purple after cutting, darkens toward brown in sunlight. Very hard, dulls tools, can gum up on the saw. Popular as an accent stripe.",u:"Accent strips in cutting boards and boxes, inlay, turnings."},{n:"Padauk",j:1970,t:["figured","hard","food"],d:"Bright orange-red that fades to reddish brown. The dust stains everything (and everyone) orange and is a respiratory irritant, so mask up and clean the shop after. Works easily for its hardness.",u:"Accent strips, boxes, turnings, small decorative parts."},{n:"Wenge",j:1930,t:["figured","hard"],d:"Almost black-brown with fine black veins and a very coarse, open grain. Heavy, hard, and splintery, so ease the edges and fill the grain if you want a smooth top. Dust is a known irritant, wear a respirator.",u:"Accent strips, fine furniture, veneer, turnings, guitar necks."},{n:"Leopardwood",j:2150,t:["figured","hard","food"],d:"Pale brown with bold dark flecks that look like leopard spots, strongest on quartersawn faces. Very hard and dense, blunts tools fast. The figure can look plain until finish goes on.",u:"Accent strips in cutting boards and boxes, veneer, turnings, inlay."},{n:"Spalted Tamarind",j:2690,t:["figured","hard"],d:"Pale yellow sapwood with dramatic black spalt lines, sold almost always as spalted sapwood. Very hard, but the spalted zones can be soft and punky, so check each piece and stabilize soft spots.",u:"Turnings, boxes, small decorative parts, accent strips."},{n:"African Mahogany",j:1070,t:["figured","outdoor"],d:"Reddish brown, lighter and softer than genuine mahogany, with interlocked grain that can tear out when planing. Works and finishes easily and takes stain well.",u:"Furniture, cabinets, boat trim, veneer, guitar bodies."},{n:"Ambrosia Maple",j:950,t:["figured","food"],d:"Soft maple with grey-brown streaks and tiny holes left by the ambrosia beetle. Same soft, easy-working wood as soft maple, just far prettier. Fill the small holes if the surface needs to be smooth.",u:"Cutting boards, boxes, furniture, turnings, accent boards."},{n:"Bloodwood",j:2900,t:["figured","hard","food"],d:"Bright blood red that deepens with age and light. Extremely hard and dense, turns and finishes to a glassy polish. Dust is irritating, wear a respirator, and keep it out of long sun or the red dulls.",u:"Accent strips in cutting boards and boxes, turnings, inlay, knife handles."}],ke=[{n:"Baltic birch",d:"Void-free with many thin plies, so the edge looks good and screws bite well. Sold in 5×5 sheets and metric thicknesses (12 mm, 18 mm), not true 1/2 or 3/4. Face veneer is thin. The best all-round shop and cabinet plywood.",u:"Drawer boxes, jigs, shop cabinets, exposed-edge furniture."},{n:"Hardwood veneer plywood (cabinet grade)",d:"Oak, maple, birch, or walnut face over a softwood or MDF core. 3/4 is really 23/32. Veneer is paper thin, so sand lightly (don't go past 180) and never with 80 grit. Check both faces and the edges for voids before buying.",u:"Cabinet carcasses, built-ins, bookcases, panels."},{n:"MDF",d:"Dead flat, no grain, machines and paints beautifully. Heavy, swells and crumbles if it gets wet, and screws into the edge will split it (predrill and use coarse threads). The dust is fine and nasty: wear a respirator.",u:"Painted doors and panels, router templates, jigs, speaker boxes."},{n:"Sanded pine / BC plywood",d:"Cheap construction plywood with one decent face. Voids inside, so edges are ugly. Fine for paint after filling.",u:"Shop furniture, shelving, painted utility projects."},{n:"CDX / sheathing",d:"Rough on both faces, meant to be covered. Exterior glue but not exterior rated on its own.",u:"Subfloors, roof and wall sheathing, temporary jigs. Not furniture."},{n:"Melamine / particleboard",d:"Cheap, flat, pre-finished white or colored surface. Chips badly on the cut (score the line first or use an 80T blade). Weak edges and no water tolerance.",u:"Garage cabinets, closet systems, shop storage."},{n:"Marine plywood",d:"Waterproof glue and void-free plies, usually okoume or meranti. Still needs a finish; it isn't rot proof, just glue proof.",u:"Boats, dock boxes, anything that stays wet."},{n:"MDO (medium density overlay)",d:"Exterior plywood with a resin-paper face that takes paint like glass and handles weather. What sign shops use.",u:"Outdoor signs, painted exterior panels, concrete forms."},{n:"Pressure treated plywood",d:"Chemically treated for ground contact and weather. Wet and heavy when new; let it dry before painting. Use hot-dipped galvanized or stainless fasteners.",u:"Sheds, outdoor structures, trailer decks."}],je=[{h:"Pocket hole screw length (Kreg jig)",b:['1/2" stock: 1" screw','3/4" stock: 1 1/4" screw','1" stock: 1 1/2" screw','1 1/8" stock: 1 1/2" screw','1 1/4" stock: 2" screw','1 1/2" stock: 2 1/2" screw',"Coarse thread for softwood, plywood, and MDF. Fine thread for hardwood.","Set both the jig and the drill bit collar to the stock thickness. Use the thinner piece's size when joining two different thicknesses."]},{h:"Nominal vs. actual thickness",b:['Rough 4/4 surfaces to about 13/16". 5/4 to about 1 1/16". 6/4 to 1 5/16". 8/4 to 1 3/4".',"Yards charge by the nominal quarter size even if the board is surfaced thinner.","2×4 is 1 1/2 × 3 1/2. 1×6 is 3/4 × 5 1/2. 3/4 plywood is 23/32.","Board feet = length × width × thickness (all inches) ÷ 144."]},{h:"Wood movement",b:['Wood moves across the grain, almost none along it. A 12" wide flatsawn board can change 1/8" or more between summer and winter.',"Interior furniture wants 6 to 9 percent moisture. Let new lumber sit in the shop a week or two before milling.","Attach wide tops with slotted holes, figure-8s, or buttons. Never glue a cross-grain joint wider than a few inches.","Quartersawn moves about half as much as flatsawn and stays flatter."]},{h:"Glue",b:["Titebond I is interior. II is water resistant. III is waterproof, has the longest open time, and is food safe when cured.","Clamp 30 to 60 minutes, then leave the joint alone for 24 hours.","Long-grain joints are stronger than the wood. End-grain glue is nearly worthless; use a joint or fastener.","Wipe oily woods (teak, ipe, rosewood) with acetone right before gluing.","Wipe squeeze-out with a damp rag or scrape it when rubbery; dried glue blocks stain."]},{h:"Cutting boards",b:["Closed-grain hardwoods only: hard maple, walnut, cherry, beech. Skip oak (porous), softwoods, and any exotic with toxic dust.","Edge grain is simpler and stays flatter. End grain is kinder to knives but needs the extra glue-up and a flattening pass.",'For end grain, rip strips 1 1/4 to 1 1/2" wide, glue, crosscut, flip, and glue again.',"Finish with food-grade mineral oil, then a beeswax and oil paste. Never vegetable or olive oil (goes rancid).","Put rubber feet on it so it dries evenly and doesn't cup."]},{h:"Sanding and finishing",b:["Progression: 80 to flatten, 120, 180, 220. Skipping more than one grit leaves scratches.","Stop at 180 before stain; going finer closes the pores and lightens the color.","Raise the grain with a damp rag before any water-based finish, let dry, sand lightly, then finish.","Shellac (dewaxed) seals anything and blocks pine pitch and knots; poly goes over it.","Wipe-on poly is the easiest durable finish. Oil and wax is the easiest to repair.","Oil-soaked rags can self-ignite. Lay them flat outside to dry or put them in water."]},{h:"Screws, blades, tools",b:["Always predrill hardwood. Pilot hole equals the screw's core (shank) diameter. #8 handles most furniture.","Table saw: 24T rip, 40T combination for general use, 80T for plywood and crosscuts. Full kerf is 1/8, thin kerf about 3/32 (match the app setting).","Planer: 1/32 to 1/16 per pass on hardwood. Lift the tail of the board on entry and exit to reduce snipe, or run a sacrificial board behind it.","Riving knife on, push sticks out, never freehand a cut. Respirator for MDF and exotics; walnut and cedar dust are sensitizers."]},{h:"Finish & food safety",b:["Mineral oil and a beeswax-and-oil paste are the standard food-safe finishes for cutting boards. Re-oil when water stops beading.","Pure tung oil and salad bowl finish are food safe once fully cured. Check the label: blends sold as 'tung oil finish' often are not.","Film finishes like polyurethane, lacquer, and epoxy are fine on the outside of a box or on furniture, never on a cutting surface.","Never use vegetable or olive oil on a board: they go rancid. Never use deck oil, Danish oil blends, or anything with chemical driers on food-contact surfaces unless the label says food safe.","Let oil finishes cure fully before use. Mineral oil is ready right away. Pure tung oil needs days to a week. Salad bowl finish per the can, usually about 72 hours."]},{h:"Moisture & acclimation",b:["Interior furniture wants wood at 6 to 9 percent moisture. A board that feels dry can still be well over 12 percent.","Let new lumber sit in the shop a week or two before milling so it settles to shop conditions. Stickers between boards help air move.","Rough-mill oversize, let it rest overnight, then mill to final size. Wood moves most right after the first cut.","Keep fresh glue-ups and finished pieces out of damp garages and direct sun while they cure.","A simple pin meter is enough for shop use. Check the middle of a board, not just the ends, and compare against a known dry offcut."]}];function Ne({plans:e,setPlans:t,projects:n,speciesList:r,setMsg:a,onUpload:l}){let[s,o]=(0,v.useState)(""),[i,u]=(0,v.useState)(null),[c,d]=(0,v.useState)(null),f=e.find(e=>e.id===i)||null,p=e=>{u(e.id),d({title:e.title,notes:e.notes||"",linkType:e.linkType||"",linkId:e.linkId||""})},h=()=>{c&&c.title.trim()?t(e=>e.map(e=>e.id===i?{...e,title:c.title.trim(),notes:c.notes,linkType:c.linkType,linkId:c.linkId,updatedAt:Date.now()}:e)):a("Give the plan a title first.")},m=e.filter(e=>!s||e.title.toLowerCase().includes(s.toLowerCase())||(e.notes||"").toLowerCase().includes(s.toLowerCase()));return f?(0,F.jsxs)("div",{className:"space-y-4",children:[(0,F.jsxs)("div",{className:"flex items-center gap-2",children:[(0,F.jsx)("button",{onClick:()= <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

window.__shopSyncLoaded = true;

const firebaseConfig = {
  apiKey: "AIzaSyCJFARib1DHOlnSNSh6ui6PVPjg6LHQOGY",

  projectId: "shop-cut-list",

  messagingSenderId: "311996918372",
  appId: "1:311996918372:web:e75b6c5336b294a1cc0d71"
};

const P = "shop:";
const CLIENT = Math.random().toString(36).slice(2) + "-" + Date.now();
const gate = document.getElementById("shopgate");
const bar = document.getElementById("shopbar");
const who = document.getElementById("shopwho");
const stat = document.getElementById("shopstat");
const signinBtn = document.getElementById("shopsignin");
const signoutBtn = document.getElementById("shopsignout");
const loading = document.getElementById("shoploading");
const errBox = document.getElementById("shoperr");
const banner = document.getElementById("shopbanner");
const refreshBtn = document.getElementById("shoprefresh");

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
window.__shopUpload = async function(file, folder) {
  if (!auth.currentUser) throw new Error("Sign in first, then try the upload again.");
  const safe = String(file.name || "file").replace(/[^\w.\-]+/g, "_");
  const path = "uploads/" + auth.currentUser.uid + "/" + (folder || "plans") + "/" + Date.now() + "-" + safe;
  const snap = await uploadBytes(storageRef(storage, path), file, { contentType: file.type || undefined });
  const url = await getDownloadURL(snap.ref);
  return { name: file.name || safe, type: file.type || "", size: file.size || 0, url: url, path: path };
};

let ref = null, pushTimer = null, lastLocalWrite = 0, appliedAt = 0, pendingRemote = null, mounted = false;

function setStatus(t){ stat.textContent = t; }

  try { localStorage.setItem("shopbackup:" + tag + ":" + Date.now(), JSON.stringify(m)); } catch(e){}

function mount(){
  if (mounted) return;
  mounted = true;
  gate.hidden = true; gate.style.display = "none";
  if (window.__mountShopApp) window.__mountShopApp();
}
async function push(){
  if (!ref) return;
  try {
    const payload = { data: readLocal(), writer: CLIENT, updatedAt: Date.now() };
    await setDoc(ref, payload);
    appliedAt = payload.updatedAt;
    setStatus("Synced");
  } catch(e){ setStatus("Offline, saved here"); }
}
window.__shopOnWrite = function(){
  if (!ref) return;
  lastLocalWrite = Date.now();
  setStatus("Saving\u2026");
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 900);
};
function applyRemote(){

  location.reload();

refreshBtn.addEventListener("click", applyRemote);

signinBtn.addEventListener("click", async function(){

  provider.setCustomParameters({ prompt: "select_account" });
  try { await signInWithPopup(auth, provider); }

  }

signoutBtn.addEventListener("click", async function(){ try { await signOut(auth); } catch(e){} location.reload(); });

getRedirectResult(auth).catch(function(){});

onAuthStateChanged(auth, async function(user){

    loading.hidden = true;
    signinBtn.hidden = false;
    signinBtn.disabled = false;
    return;
